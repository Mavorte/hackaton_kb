[project]
name = "kb-hackathon"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "boto3[crt]>=1.35",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "pyyaml>=6",
  "mcp>=1.2",
  "pymupdf>=1.24",
  "reportlab>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
kb = ["*.yaml"]
